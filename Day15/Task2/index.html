<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <container>
      <div
        style="height: 100vh; background-color: #f5f6fa"
        class="row d-flex justify-content-center align-content-center"
      >
        <div
          class="w-25 h-auto d-flex pt-5 align-content-center flex-column text-center border border-2 border-primary shadow-lg"
          style="border-radius: 13px"
        >
          <h1>My To-Do List</h1>
          <div>
            <input
              type="text"
              id="taskInput"
              class="form-control w-75 mt-3 mb-5 d-inline-block"
              name="taskInput"
              placeholder="Add a new task"
            />
            <button class="btn btn-primary mb-1" id="addButton">Add</button>
          </div>
          <div id="taskContainer"></div>
        </div>
      </div>
    </container>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
